spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  application:
    name: tp-adresse-test
  datasource:
    url: jdbc:postgresql://localhost:5432/adresses?reWriteBatchedInserts=true
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:init.sql

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n"
  file:
    name: data/logs/address-import.log
  level:
    root: INFO
    fr.natsystem.tp_adresse_test: INFO

batch:
  address:
    input-directory: src/test/resources
    archive-directory: src/test/resources
    download-enabled: false
    download-url: https://adresse.data.gouv.fr/data/ban/adresses/latest/csv/adresses-79.csv.gz
    download-file-name: adresses-france.csv.gz
    extract-file-name: adresses-france.csv
    report-directory: src/test/resources
    chunk-size: 10484
    partition-count : 8
    sql:
      initialization-script: classpath:sql/initialization-table-ban.sql
      insert-stage-sql : classpath:sql/insert-address.sql
      detect-duplicates-and-conflicts-script: classpath:sql/detect-duplicates-and-conflicts.sql
      synchro-plan-script: classpath:sql/synchro-plan.sql
      final-import-script: classpath:sql/final-import.sql
  dvf:
    extract-file-name : data/csv/dvf/full.csv
    vue-dvf-statistique : classpath:sql/vue-dvf-statistique.sql
    insert-sql: classpath:sql/insert-dvf-address.sql
  geo-contour:
    extract-file-name: data/json/geojson/communes-100m.geojson
server:
  port: 8080